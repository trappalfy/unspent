# Indexer on Fly.io (brief 9.1, Q11): program logs → chain_events. One machine, no public port.
# Created, given its secrets and deployed by ops/fly-up.sh (together with the gateway).
app = "unspent-indexer"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NEXT_PUBLIC_SOLANA_NETWORK = "mainnet"

[processes]
  app = "pnpm --filter @unspent/indexer start"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
