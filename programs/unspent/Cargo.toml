[package]
name = "unspent"
version = "0.1.0"
description = "Unspent: LLM inference credits as an SPL token, with onchain per-request reservations"
license = "MIT"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "unspent"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.2.1", default-features = false, features = ["init-if-needed", "solana-v4"] }
anchor-spl = { version = "1.2.1", default-features = false, features = ["token", "token_2022", "token_2022_extensions", "associated_token", "mint", "solana-v4"] }

[dev-dependencies]
litesvm = "0.18.0"
solana-message = "4"
solana-transaction = "4"
solana-signer = "3"
solana-keypair = "3.1"
solana-account = "4"
solana-instruction = "3.5"
solana-program-pack = "*"
solana-program-option = "*"
proptest = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
